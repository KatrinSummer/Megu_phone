<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#bfe6f5">
<!-- Read before the first paint, or a dark session starts with a bright flash. -->
<script>try{if(JSON.parse(localStorage.getItem('megu.settings.v1')||'{}').theme==='dark'){
  document.documentElement.dataset.theme='dark';
  document.querySelector('meta[name=theme-color]').content='#0d1733';}}catch{}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<title>Megu</title>
</head>
<body>
<header>
  <!-- What goes inside these three is her own icon, put in by app.js: the sheet
       they come from is a theme away, so it is not written out here. -->
  <button class="icon" id="back" aria-label="Back to the boards"></button>
  <div class="grow"><div class="counts" id="counts">…</div></div>
  <button class="icon" id="star" aria-label="Bookmark"></button>
  <button class="icon" id="menu" aria-label="Settings"></button>
</header>

<!-- Only ever seen when the phone refuses to write: a save that fails in
     silence is the app quietly forgetting everything she does. -->
<div id="warn" hidden></div>

<div class="stats" id="stats" hidden></div>

<main id="main"></main>

<!-- The four places the app has.  Filled in by nav.js. -->
<nav id="tabs"></nav>

<script src="app.js" type="module"></script>
</body>
</html>
